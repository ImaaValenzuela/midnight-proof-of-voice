name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/voice-verifier/requirements.lock
      - run: npm ci --ignore-scripts
      - run: npm run setup:python
      - run: .tools/venv/bin/python -m pip check
      - run: npm run setup:env
      - run: docker compose config --quiet
      - run: docker compose --env-file .env -f infra/compose.data.yml config --quiet
      - run: bash scripts/setup-compact.sh
      - run: npm run check
      - run: npm run test:http
      - run: npm run pack:sdk
